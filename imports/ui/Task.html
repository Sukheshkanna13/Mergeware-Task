<template name="Task">
  <li class="task-item {{checkedClass}}" data-id="{{_id}}">
    <span class="drag-handle" title="Drag to reorder">⠿</span>
    <input class="task-checkbox" type="checkbox" checked="{{checkedAttr}}" data-id="{{_id}}">
    <span class="category-badge" style="{{categoryBadgeStyle}}">{{categoryLabel}}</span>
    <span class="task-text">{{text}}</span>
    <select class="inline-category-select" data-id="{{_id}}">
      {{#each categoryOptionsWithSelected}}
        <option value="{{key}}" selected="{{selectedAttr}}">{{label}}</option>
      {{/each}}
    </select>
    <button class="btn-delete" data-id="{{_id}}" title="Delete task">✕</button>
  </li>
</template>
